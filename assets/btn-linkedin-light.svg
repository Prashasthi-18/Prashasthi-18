<svg xmlns="http://www.w3.org/2000/svg" width="128" height="44" viewBox="0 0 128 44" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .sheen { animation: sheen 5s ease-in-out infinite; animation-delay: 1.2s; }
    @keyframes sheen { 0% { transform: skewX(-20deg) translateX(0); } 40%, 100% { transform: skewX(-20deg) translateX(288px); } }
    </style>

<defs>
  <clipPath id="c"><rect x="1" y="1" width="126" height="42" rx="8"/></clipPath>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g class="sans">
  <rect x=".5" y=".5" width="127" height="43" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <g clip-path="url(#c)"><rect class="sheen" x="-80" y="0" width="60" height="44" fill="url(#sheen)" transform="skewX(-20)"/></g>
  <rect x="19" y="13" width="18" height="18" rx="3.5" fill="none" stroke="#1f2328" stroke-width="1.6"/><text x="28" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2328">in</text>
  <text x="46" y="27.5" font-size="14" font-weight="600" fill="#1f2328">LinkedIn</text>
</g>
</svg>
