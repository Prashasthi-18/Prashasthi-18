<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Experience &amp; education">
<title>Experience &amp; education</title>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .d1 { animation-delay: .1s; } .d2 { animation-delay: .2s; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0; } 50% { stroke-opacity: .9; } }
    .scan { animation: scan 7s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes scan { 0% { transform: translateX(0); } 70%, 100% { transform: translateX(1440px); } }
    </style>

<defs><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a371f7" stop-opacity="0"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/></linearGradient></defs>
<g class="sans">
  <g class="rise">
    <rect x="1" y="13" width="40" height="40" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect class="pulse" x="1" y="13" width="40" height="40" rx="9" fill="none" stroke="#a371f7"/>
    <g transform="translate(11 23) scale(1)" fill="none" stroke="#a371f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="16" height="11" rx="2"/><path d="M7 6V4.5A1.5 1.5 0 0 1 8.5 3h3A1.5 1.5 0 0 1 13 4.5V6M2 11h16"/></g>
  </g>
  <text class="rise d1" x="58" y="43" font-size="24" font-weight="600" fill="#e6edf3">Experience &amp; education</text>
  <text class="rise d2 mono" x="1198" y="41" text-anchor="end" font-size="12.5" fill="#6e7681">git log --author=prashasthi</text>
  <rect x="0" y="66" width="1200" height="1" fill="#30363d"/>
  <rect class="scan" x="-240" y="65.5" width="240" height="2" rx="1" fill="url(#hl)"/>
</g>
</svg>
