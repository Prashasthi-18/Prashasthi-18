<svg xmlns="http://www.w3.org/2000/svg" width="129" height="44" viewBox="0 0 129 44" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .sheen { animation: sheen 5s ease-in-out infinite; animation-delay: 0s; }
    @keyframes sheen { 0% { transform: skewX(-20deg) translateX(0); } 40%, 100% { transform: skewX(-20deg) translateX(289px); } }
    </style>

<defs>
  <clipPath id="c"><rect x="1" y="1" width="127" height="42" rx="8"/></clipPath>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g class="sans">
  <rect x=".5" y=".5" width="128" height="43" rx="8" fill="#8957e5" stroke="#8957e5"/>
  <g clip-path="url(#c)"><rect class="sheen" x="-80" y="0" width="60" height="44" fill="url(#sheen)" transform="skewX(-20)"/></g>
  <g transform="translate(18 13) scale(0.9)" fill="none" stroke="#ffffff" stroke-width="1.77778" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.2 2.3 3 4.8 3 7.5s-.8 5.2-3 7.5c-2.2-2.3-3-4.8-3-7.5s.8-5.2 3-7.5z"/></g>
  <text x="46" y="27.5" font-size="14" font-weight="600" fill="#ffffff">Portfolio</text>
</g>
</svg>
