<svg xmlns="http://www.w3.org/2000/svg" width="600" height="176" viewBox="0 0 600 176" role="img" aria-label="Price-Pulse: Chrome extension that detects the product on the current page and compares its price across Amazon, Flipkart, Croma, Reliance Digital and more.">
<title>Price-Pulse: Chrome extension that detects the product on the current page and compares its price across Amazon, Flipkart, Croma, Reliance Digital and more.</title>
<style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .sweep { stroke-dasharray: 140 860; stroke-dashoffset: 0; animation: sweep 9s linear infinite; }
    @keyframes sweep { to { stroke-dashoffset: -1000; } }
    </style>

<defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs>
<g class="sans rise">
  <rect x=".5" y=".5" width="599" height="175" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect class="sweep" x=".5" y=".5" width="599" height="175" rx="8" fill="none" stroke="url(#edge)" stroke-width="1.5" pathLength="1000" style="animation-delay:-6.5s"/>
  <g transform="translate(22 22) scale(0.9)" fill="none" stroke="#59636e" stroke-width="1.77778" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V4.5A2 2 0 0 1 6 2.5h10v12H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h10M7.5 6.5h5"/></g>
  <text x="48" y="37" font-size="16" font-weight="600" fill="#0969da">Price-Pulse</text>
  <rect x="150" y="23" width="52" height="20" rx="10" fill="none" stroke="#d0d7de"/>
  <text x="176" y="37" text-anchor="middle" font-size="11.5" font-weight="500" fill="#59636e">Public</text>
  <text x="24" y="76" font-size="13.5" fill="#59636e">Chrome extension that detects the product on the current page and compares its price</text><text x="24" y="97" font-size="13.5" fill="#59636e">across Amazon, Flipkart, Croma, Reliance Digital and more.</text>
  <circle cx="30" cy="146" r="6" fill="#f1e05a"/><text x="42" y="150.5" font-size="12.5" fill="#59636e">JavaScript</text><rect x="124" y="135" width="115" height="22" rx="11" fill="#0969da" fill-opacity=".1"/><text x="181" y="150" text-anchor="middle" font-size="11.5" font-weight="500" fill="#0969da">chrome-extension</text><rect x="245" y="135" width="105" height="22" rx="11" fill="#0969da" fill-opacity=".1"/><text x="297" y="150" text-anchor="middle" font-size="11.5" font-weight="500" fill="#0969da">service-worker</text>
</g>
</svg>
