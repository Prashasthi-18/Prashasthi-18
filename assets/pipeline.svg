<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="How I build: Understand, Retrieve, Reason, Guard, Ship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0b1f"/><stop offset="1" stop-color="#05060d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="190" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .box { stroke: #2a2650; animation: lit 7.5s ease-in-out infinite; }
    .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.5s; } .s3 { animation-delay: 3s; } .s4 { animation-delay: 4.5s; } .s5 { animation-delay: 6s; }
    @keyframes lit { 0%, 24%, 100% { stroke: #2a2650; fill: #100e24; } 8% { stroke: #a78bfa; fill: #1a1540; } }
    .ico { animation: pop 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0%, 24%, 100% { transform: scale(1); } 8% { transform: scale(1.18); } }
    .wire { stroke-dasharray: 3 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="190" fill="url(#bg)"/>
    <text x="40" y="38" class="mono" font-size="12.5" fill="#a78bfa" letter-spacing="2">HOW I BUILD</text>
    <text x="1160" y="38" class="mono" font-size="12.5" fill="#4b5563" text-anchor="end" letter-spacing="1">requirement → reliable AI product</text>

    <!-- wires -->
    <g stroke="url(#edge)" stroke-width="1.5" stroke-opacity=".6">
      <path class="wire" d="M244 112 H274"/>
      <path class="wire" d="M478 112 H508"/>
      <path class="wire" d="M712 112 H742"/>
      <path class="wire" d="M946 112 H976"/>
    </g>
    <g fill="#ffffff">
      <circle r="3"><animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.12;.2;1" calcMode="linear" path="M244 112 H274"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.115;.12;.2;0.205;1" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.32;.4;1" calcMode="linear" path="M478 112 H508"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.315;.32;.4;0.405;1" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.52;.6;1" calcMode="linear" path="M712 112 H742"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.515;.52;.6;0.605;1" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.72;.8;1" calcMode="linear" path="M946 112 H976"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.715;.72;.8;0.805;1" dur="7.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- stages -->
    <g class="sans">
      <rect fill="#100e24" class="box s1" x="40" y="62" width="204" height="100" rx="16" stroke-width="1.5"/>
      <g class="ico s1"><circle cx="76" cy="96" r="16" fill="#1e1a44" stroke="#a78bfa" stroke-opacity=".55"/><text x="76" y="100.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c4b5fd">01</text></g>
      <text x="100" y="98" font-size="16" font-weight="600" fill="#f3f4f6">Understand</text>
      <text x="100" y="118" font-size="12.5" fill="#9ca3af">requirements, PRDs,</text>
      <text x="100" y="136" font-size="12.5" fill="#9ca3af">open questions</text>

      <rect fill="#100e24" class="box s2" x="274" y="62" width="204" height="100" rx="16" stroke-width="1.5"/>
      <g class="ico s2"><circle cx="310" cy="96" r="16" fill="#1e1a44" stroke="#a78bfa" stroke-opacity=".55"/><text x="310" y="100.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c4b5fd">02</text></g>
      <text x="334" y="98" font-size="16" font-weight="600" fill="#f3f4f6">Retrieve</text>
      <text x="334" y="118" font-size="12.5" fill="#9ca3af">RAG, embeddings,</text>
      <text x="334" y="136" font-size="12.5" fill="#9ca3af">vector search</text>

      <rect fill="#100e24" class="box s3" x="508" y="62" width="204" height="100" rx="16" stroke-width="1.5"/>
      <g class="ico s3"><circle cx="544" cy="96" r="16" fill="#1e1a44" stroke="#a78bfa" stroke-opacity=".55"/><text x="544" y="100.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c4b5fd">03</text></g>
      <text x="568" y="98" font-size="16" font-weight="600" fill="#f3f4f6">Reason</text>
      <text x="568" y="118" font-size="12.5" fill="#9ca3af">multi-agent flows,</text>
      <text x="568" y="136" font-size="12.5" fill="#9ca3af">LangGraph · CrewAI</text>

      <rect fill="#100e24" class="box s4" x="742" y="62" width="204" height="100" rx="16" stroke-width="1.5"/>
      <g class="ico s4"><circle cx="778" cy="96" r="16" fill="#1e1a44" stroke="#a78bfa" stroke-opacity=".55"/><text x="778" y="100.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c4b5fd">04</text></g>
      <text x="802" y="98" font-size="16" font-weight="600" fill="#f3f4f6">Guard</text>
      <text x="802" y="118" font-size="12.5" fill="#9ca3af">guardrails, PII,</text>
      <text x="802" y="136" font-size="12.5" fill="#9ca3af">human-in-the-loop</text>

      <rect fill="#100e24" class="box s5" x="976" y="62" width="184" height="100" rx="16" stroke-width="1.5"/>
      <g class="ico s5"><circle cx="1012" cy="96" r="16" fill="#1e1a44" stroke="#a78bfa" stroke-opacity=".55"/><text x="1012" y="100.5" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#c4b5fd">05</text></g>
      <text x="1036" y="98" font-size="16" font-weight="600" fill="#f3f4f6">Ship</text>
      <text x="1036" y="118" font-size="12.5" fill="#9ca3af">evals, tests,</text>
      <text x="1036" y="136" font-size="12.5" fill="#9ca3af">LLMOps</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="188.5" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
</svg>
