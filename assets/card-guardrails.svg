<svg xmlns="http://www.w3.org/2000/svg" width="600" height="176" viewBox="0 0 600 176" role="img" aria-label="Guardrails-Mini-Project: Healthcare assistant with layered guardrails: input validation, PII redaction, human approval for bookings and output validation.">
